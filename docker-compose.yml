name: qec-chain-review

services:
  web:
    build: .
    image: qec-chain-review:latest
    environment:
      PORT: 8080
    ports:
      # 宿主机网页端口可通过 WEB_PORT 环境变量配置，默认 8080
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$$PORT/healthz >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # 一次性验收服务：执行验收场景、匹配代码测试、构建检查与 HTTP 冒烟后退出，
  # 以退出码报告结果（0 通过 / 1 失败）。
  verify:
    image: qec-chain-review:latest
    depends_on:
      web:
        condition: service_healthy
    environment:
      WEB_URL: http://web:8080
    command: ["node", "verify.js"]
    restart: "no"
