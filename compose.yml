services:
  web:
    build:
      context: .
      target: web
    image: qec-chain-review:latest
    container_name: qec-chain-review-web
    environment:
      # 容器内固定监听 8080；宿主机端口用 WEB_PORT 配置
      PORT: "8080"
    ports:
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(r.status!==200)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s
    restart: unless-stopped

  # 一次性验收服务：执行完毕即退出，以退出码报告结果。
  # 运行：docker compose --profile verify run --rm verify
  verify:
    profiles: ["verify"]
    build:
      context: .
      target: verify
    image: qec-chain-review-verify:latest
    command: ["node", "scripts/verify.mjs", "--web-url", "http://web:8080"]
    depends_on:
      web:
        condition: service_healthy
    restart: "no"
